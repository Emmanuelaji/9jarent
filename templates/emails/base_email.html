<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}9jaRent{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background:#F8F9FA; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F9FA; padding: 24px 0;">
<tr><td align="center">
<table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:12px; overflow:hidden; max-width:480px; width:100%;">

    <tr>
        <td style="background:#0B3D2E; padding: 24px 32px;">
            <span style="color:#ffffff; font-size:20px; font-weight:700;">
                9ja<span style="color:#F2A93B;">Rent</span>.com.ng
            </span>
        </td>
    </tr>

    <tr>
        <td style="padding: 32px;">
            {% block content %}{% endblock %}
        </td>
    </tr>

    <tr>
        <td style="padding: 20px 32px; background:#F8F9FA; border-top:1px solid #E9ECEF;">
            <p style="margin:0 0 6px; font-size:12px; color:#888888; line-height:1.5;">
                You're receiving this because of activity on your 9jaRent.com.ng account.
            </p>
            <p style="margin:0; font-size:12px; color:#888888;">
                &copy; 9jaRent.com.ng
            </p>
        </td>
    </tr>

</table>
</td></tr>
</table>
</body>
</html>
