{% extends 'accounts/auth_base.html' %}
{% block title %}Forgot Password? | 9jaRent{% endblock %}

{% block auth_content %}
<div class="text-center mb-4">
    <div class="mb-3 position-relative d-inline-block">
        <!-- Envelope illustration using CSS -->
        <div style="width: 80px; height: 60px; background: #F2A93B; border-radius: 8px; position: relative; margin: 0 auto;">
            <div style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-top: 30px solid #F2A93B;"></div>
            <div style="position: absolute; top: -2px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 40px solid transparent; border-right: 40px solid transparent; border-top: 30px solid #F2A93B;"></div>
        </div>
        <!-- Checkmark -->
        <div class="position-absolute" style="bottom: -5px; right: -10px; width: 28px; height: 28px; background: #0B6E4F; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid #fff;">
            <i class="fas fa-check" style="color: #fff; font-size: 0.7rem;"></i>
        </div>
    </div>
    <h3 class="fw-bold mb-1 display-font" style="font-size: 1.5rem;">Forgot Password?</h3>
    <p class="text-muted" style="font-size: 0.9rem;">No worries! Enter your email address and we'll send you a link to reset your password.</p>
</div>

<form method="post">
    {% csrf_token %}
    <div class="mb-4">
        <label class="form-label-9ja">Email Address</label>
        <input type="email" name="email" class="form-control form-control-9ja" placeholder="Enter your email address" required>
    </div>
    <button type="submit" class="btn btn-amber w-100 py-2 mb-3" style="border-radius: 10px; font-weight: 600;">Send Reset Link</button>
</form>

<p class="text-center small text-muted mb-0">
    Remember your password? <a href="{% url 'accounts:login' %}" class="fw-semibold" style="color: var(--emerald);">Log in</a>
</p>
{% endblock %}
