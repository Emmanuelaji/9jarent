{% extends 'accounts/auth_base.html' %}
{% block title %}Create Renter Account | 9jaRent{% endblock %}

{% block auth_content %}
<div class="text-center mb-4">
    <h3 class="fw-bold mb-1 display-font" style="font-size: 1.5rem;">Create Renter Account</h3>
    <p class="text-muted" style="font-size: 0.9rem;">Join thousands of renters finding their perfect homes.</p>
</div>

<!-- Email/Phone Toggle -->
<div class="toggle-tabs mb-4">
    <button type="button" class="toggle-tab active" id="emailTab" onclick="switchTab('email')">Email</button>
    <button type="button" class="toggle-tab" id="phoneTab" onclick="switchTab('phone')">Phone</button>
</div>

<form method="post" action="{% url 'accounts:renter_signup' %}">
    {% csrf_token %}
    
    <!-- Full Name -->
    <div class="mb-3">
        <label class="form-label-9ja">Full Name</label>
        <input type="text" name="first_name" class="form-control form-control-9ja" placeholder="Enter your full name" required>
    </div>
    
    <!-- Email -->
    <div id="emailField">
        <label class="form-label-9ja">Email Address</label>
        <input type="email" name="email" class="form-control form-control-9ja mb-3" placeholder="Enter your email address" required>
    </div>
    
    <!-- Phone -->
    <div id="phoneField" style="display: none;">
        <label class="form-label-9ja">Phone Number</label>
        <input type="tel" name="phone" class="form-control form-control-9ja mb-3" placeholder="080 1234 5678">
    </div>
    
    <!-- Password -->
    <div class="mb-3">
        <label class="form-label-9ja">Password</label>
        <div class="position-relative">
            <input type="password" name="password1" id="signupPassword" class="form-control form-control-9ja" placeholder="Create a password" required>
            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2" onclick="togglePassword('signupPassword')" style="color: var(--ink-soft); padding: 0;">
                <i class="far fa-eye" id="signupPasswordEye"></i>
            </button>
        </div>
    </div>
    
    <!-- Confirm Password -->
    <div class="mb-3">
        <label class="form-label-9ja">Confirm Password</label>
        <div class="position-relative">
            <input type="password" name="password2" id="confirmPassword" class="form-control form-control-9ja" placeholder="Confirm your password" required>
            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2" onclick="togglePassword('confirmPassword')" style="color: var(--ink-soft); padding: 0;">
                <i class="far fa-eye" id="confirmPasswordEye"></i>
            </button>
        </div>
    </div>
    
    <!-- Terms -->
    <div class="mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="agree_terms" id="agreeTerms" required style="border-color: var(--border-light);">
            <label class="form-check-label small text-muted" for="agreeTerms">
                I agree to the <a href="#" style="color: var(--emerald);">Terms & Conditions</a> and <a href="#" style="color: var(--emerald);">Privacy Policy</a>
            </label>
        </div>
    </div>
    
    <button type="submit" class="btn btn-amber w-100 py-2 mb-3" style="border-radius: 10px; font-weight: 600;">Create Account</button>
</form>

<p class="text-center small text-muted mb-0">
    Already have an account? <a href="{% url 'accounts:login' %}" class="fw-semibold" style="color: var(--emerald);">Log in</a>
</p>

<script>
function switchTab(tab) {
    const emailTab = document.getElementById('emailTab');
    const phoneTab = document.getElementById('phoneTab');
    const emailField = document.getElementById('emailField');
    const phoneField = document.getElementById('phoneField');
    
    if (tab === 'email') {
        emailTab.classList.add('active');
        phoneTab.classList.remove('active');
        emailField.style.display = 'block';
        phoneField.style.display = 'none';
        emailField.querySelector('input').required = true;
        if (phoneField.querySelector('input')) phoneField.querySelector('input').required = false;
    } else {
        phoneTab.classList.add('active');
        emailTab.classList.remove('active');
        emailField.style.display = 'none';
        phoneField.style.display = 'block';
        if (emailField.querySelector('input')) emailField.querySelector('input').required = false;
        phoneField.querySelector('input').required = true;
    }
}

function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(fieldId + 'Eye');
    if (field.type === 'password') {
        field.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    } else {
        field.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
