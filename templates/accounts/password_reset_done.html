{% extends 'accounts/auth_base.html' %}
{% block auth_content %}
<div class="text-center">
    <i class="fas fa-envelope-circle-check fa-3x mb-3" style="color: var(--emerald);"></i>
    <h3 class="display-font mb-2">Check your email</h3>
    <p class="text-muted">If an account exists with that email, we've sent a link to reset your password. It expires in 1 hour.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-nigeria mt-2">Back to Login</a>
</div>
{% endblock %}
