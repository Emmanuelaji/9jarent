{% extends 'accounts/auth_base.html' %}
{% block title %}Welcome Back | 9jaRent{% endblock %}

{% block auth_content %}
<div class="text-center mb-4">
    <h3 class="fw-bold mb-1 display-font" style="font-size: 1.5rem;">Welcome Back</h3>
    <p class="text-muted" style="font-size: 0.9rem;">Log in to your account to continue</p>
</div>

<!-- Email/Phone Toggle -->
<div class="toggle-tabs mb-4">
    <button type="button" class="toggle-tab active" id="emailTab" onclick="switchTab('email')">Email</button>
    <button type="button" class="toggle-tab" id="phoneTab" onclick="switchTab('phone')">Phone</button>
</div>

<form method="post" action="{% url 'accounts:login' %}">
    {% csrf_token %}
    
    <!-- Email Field -->
    <div id="emailField">
        <label class="form-label-9ja">Email Address</label>
        <input type="email" name="username" class="form-control form-control-9ja mb-3" placeholder="Enter your email address" required>
    </div>
    
    <!-- Phone Field (hidden by default) -->
    <div id="phoneField" style="display: none;">
        <label class="form-label-9ja">Phone Number</label>
        <input type="tel" name="phone" class="form-control form-control-9ja mb-3" placeholder="080 1234 5678">
    </div>
    
    <!-- Password -->
    <div class="mb-3">
        <label class="form-label-9ja">Password</label>
        <div class="position-relative">
            <input type="password" name="password" id="loginPassword" class="form-control form-control-9ja" placeholder="Enter your password" required>
            <button type="button" class="btn btn-link position-absolute end-0 top-50 translate-middle-y me-2" onclick="togglePassword('loginPassword')" style="color: var(--ink-soft); padding: 0;">
                <i class="far fa-eye" id="loginPasswordEye"></i>
            </button>
        </div>
    </div>
    
    <!-- Remember me + Forgot password -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe" style="border-color: var(--border-light);">
            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
        </div>
        <a href="{% url 'accounts:password_reset' %}" class="small fw-semibold" style="color: var(--emerald);">Forgot password?</a>
    </div>
    
    <button type="submit" class="btn btn-amber w-100 py-2 mb-3" style="border-radius: 10px; font-weight: 600;">Log In</button>
</form>

<!-- Divider -->
<div class="d-flex align-items-center gap-3 my-4">
    <div class="flex-fill" style="height: 1px; background: var(--border-light);"></div>
    <span class="small text-muted">or continue with</span>
    <div class="flex-fill" style="height: 1px; background: var(--border-light);"></div>
</div>

<!-- Social Login -->
<div class="d-flex gap-3 mb-4">
    <button type="button" class="social-btn flex-fill">
        <img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google">
        <span>Continue with Google</span>
    </button>
    <button type="button" class="social-btn flex-fill">
        <i class="fab fa-apple" style="font-size: 18px;"></i>
        <span>Continue with Apple</span>
    </button>
</div>

<p class="text-center small text-muted mb-0">
    Don't have an account? <a href="{% url 'accounts:signup' %}" class="fw-semibold" style="color: var(--emerald);">Sign up</a>
</p>

<script>
function switchTab(tab) {
    const emailTab = document.getElementById('emailTab');
    const phoneTab = document.getElementById('phoneTab');
    const emailField = document.getElementById('emailField');
    const phoneField = document.getElementById('phoneField');
    
    if (tab === 'email') {
        emailTab.classList.add('active');
        phoneTab.classList.remove('active');
        emailField.style.display = 'block';
        phoneField.style.display = 'none';
        emailField.querySelector('input').required = true;
        phoneField.querySelector('input').required = false;
    } else {
        phoneTab.classList.add('active');
        emailTab.classList.remove('active');
        emailField.style.display = 'none';
        phoneField.style.display = 'block';
        emailField.querySelector('input').required = false;
        phoneField.querySelector('input').required = true;
    }
}

function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const eye = document.getElementById(fieldId + 'Eye');
    if (field.type === 'password') {
        field.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
    } else {
        field.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
